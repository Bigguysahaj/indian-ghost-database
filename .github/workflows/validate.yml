name: Validate catalogue
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/catalogue.py --check
      - name: Check site/ is in sync with data/ and images/
        run: |
          python scripts/sync_site.py
          git diff --exit-code -- site/ || (echo "site/ is out of date; run scripts/sync_site.py and commit the result" && exit 1)
  build-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
